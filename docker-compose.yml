services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradebot7x
      POSTGRES_USER: tradebot
      POSTGRES_PASSWORD: tradebot
    ports:
      - "5432:5432"
    volumes:
      - tradebot7x_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://tradebot:tradebot@db:5432/tradebot7x}
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  tradebot7x_pgdata:
